# GitHub Action for generating a Pac-Man game that eats your contributions.

name: Generate Pacman

on:
  schedule:
      # every 12 hours
    - cron: "0 */12 * * *"

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

  # Also run on every push on the main branch
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned version, install scripts disabled
      - name: Install pacman-contribution-graph
        run: npm install --no-save --ignore-scripts pacman-contribution-graph@5.3.1

      - name: Generate the pacman files in './dist/'
        run: node .github/scripts/generate-pacman.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update pacman animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
